[package]
name = "ottex"
version = "0.1.0"
edition = "2021"

[dependencies]
# System tray
tray-icon = "0.19"
# Global hotkeys
global-hotkey = "0.6"
# Audio capture
cpal = "0.15"
# WAV encoding
hound = "3.5"
# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Input simulation
enigo = "0.2"
# Clipboard
arboard = "3"
# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 encoding for API calls
base64 = "0.22"
# Error handling
anyhow = "1"
# Environment variables / config
directories = "5"
toml = "0.8"
# Logging
log = "0.4"
env_logger = "0.11"
# Windows-specific event loop
winit = "0.30"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
