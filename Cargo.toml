[package]
name = "ottex"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Audio capture
cpal = "0.15"
# WAV encoding
hound = "3.5"
# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Input simulation
enigo = "0.2"
# Clipboard
arboard = "3"
# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 encoding for API calls
base64 = "0.22"
# Error handling
anyhow = "1"
# Environment variables / config
directories = "5"
toml = "0.8"
# Logging
log = "0.4"
env_logger = "0.11"
# Desktop notifications
notify-rust = "4"

# Embedded inference (candle + Whisper + LLM) - METAL backend
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
candle-transformers = "0.9"
hf-hub = { version = "0.4", features = ["tokio"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

# Audio resampling
rubato = "0.14"
byteorder = "1.5"
rand = "0.8"

# Objective-C autorelease pool (Metal GPU memory management)
objc2 = "0.6"

# UniFFI bridging
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "2.0.18"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[profile.release]
opt-level = 3
lto = true

[lints.rust]
dead_code = "allow"
